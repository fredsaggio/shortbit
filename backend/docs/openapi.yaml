openapi: 3.1.0
info:
  title: ShortBit API
  version: 0.1.0
  description: |
    Referência das rotas atualmente implementadas. A autenticação da conta usa
    uma sessão opaca no cookie HttpOnly `user_session`. Os cookies temporários
    de cadastro, recuperação e Google fazem parte dos respectivos fluxos.
    Erros são retornados como texto simples em português, exceto respostas do
    formulário HTML de senha dos links privados.
servers:
  - url: /
    description: Mesmo domínio da página de documentação
security: []
tags:
  - name: Documentação
    description: Página de referência e arquivo OpenAPI.
  - name: Saúde
    description: Estado do processo e da conexão com o banco.
  - name: Cadastro
    description: Cadastro com senha e verificação por e-mail.
  - name: Recuperação
    description: Recuperação de senha por código enviado por e-mail.
  - name: Sessões
    description: Login e logout.
  - name: Conta
    description: Dados da conta autenticada, nome completo e troca de senha.
  - name: Google
    description: Fluxo OAuth com Google.
  - name: Links
    description: Criação, consulta, desbloqueio e redirect de links públicos e privados.
paths:
  /docs:
    get:
      tags: [Documentação]
      operationId: getAPIDocumentation
      summary: Abrir a documentação da API
      responses:
        '200':
          description: Página HTML renderizada com ReDoc.
          content:
            text/html:
              schema:
                type: string
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /docs/openapi.yaml:
    get:
      tags: [Documentação]
      operationId: getOpenAPISpecification
      summary: Baixar a especificação OpenAPI
      responses:
        '200':
          description: Especificação OpenAPI em YAML.
          content:
            application/yaml:
              schema:
                type: string
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /health/live:
    get:
      tags: [Saúde]
      operationId: getLiveness
      summary: Verificar se o processo está ativo
      responses:
        '200':
          description: Processo ativo; resposta sem corpo.
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /health/ready:
    get:
      tags: [Saúde]
      operationId: getReadiness
      summary: Verificar se o banco está acessível
      responses:
        '200':
          description: Banco acessível; resposta sem corpo.
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '503':
          description: Banco indisponível.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
  /registrations/password:
    post:
      tags: [Cadastro]
      operationId: startPasswordRegistration
      summary: Iniciar cadastro com senha
      description: |
        Cria uma tentativa temporária e envia um código por e-mail. O cookie
        `password_registration` identifica a tentativa nas próximas etapas.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegistrationRequest'
      responses:
        '202':
          description: Tentativa iniciada e código enviado; sem corpo.
          headers:
            Set-Cookie:
              description: Cookie HttpOnly `password_registration` da tentativa.
              schema:
                type: string
        '400':
          $ref: '#/components/responses/BadRequest'
        '409':
          $ref: '#/components/responses/Conflict'
        '413':
          $ref: '#/components/responses/BodyTooLarge'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'
  /registrations/password/confirm:
    post:
      tags: [Cadastro]
      operationId: confirmPasswordRegistration
      summary: Confirmar cadastro com código
      description: O navegador deve reenviar o cookie `password_registration`.
      security:
        - passwordRegistration: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CodeRequest'
      responses:
        '201':
          description: Conta criada; o cookie da tentativa é removido.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '409':
          $ref: '#/components/responses/Conflict'
        '410':
          $ref: '#/components/responses/Gone'
        '413':
          $ref: '#/components/responses/BodyTooLarge'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'
  /registrations/password/resend:
    post:
      tags: [Cadastro]
      operationId: resendPasswordRegistrationCode
      summary: Reenviar código de cadastro
      description: |
        Requer o cookie da tentativa. Um novo código substitui o anterior;
        existe um intervalo mínimo de 30 segundos entre envios.
      security:
        - passwordRegistration: []
      responses:
        '202':
          description: Novo código enviado; sem corpo.
        '410':
          $ref: '#/components/responses/Gone'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'
  /password-resets:
    post:
      tags: [Recuperação]
      operationId: startPasswordReset
      summary: Solicitar recuperação de senha
      description: |
        Retorna 202 sem revelar se o e-mail possui uma conta. Quando aplicável,
        envia o código por e-mail e cria o cookie `password_reset`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EmailRequest'
      responses:
        '202':
          description: Solicitação aceita; sem corpo.
          headers:
            Set-Cookie:
              description: Cookie HttpOnly `password_reset` da tentativa, quando aplicável.
              schema:
                type: string
        '400':
          $ref: '#/components/responses/BadRequest'
        '413':
          $ref: '#/components/responses/BodyTooLarge'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'
  /password-resets/confirm:
    post:
      tags: [Recuperação]
      operationId: confirmPasswordReset
      summary: Confirmar código e alterar senha
      description: Requer o cookie `password_reset` da solicitação anterior.
      security:
        - passwordReset: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasswordResetConfirmRequest'
      responses:
        '204':
          description: Senha alterada; cookie da tentativa removido.
        '400':
          $ref: '#/components/responses/BadRequest'
        '410':
          $ref: '#/components/responses/Gone'
        '413':
          $ref: '#/components/responses/BodyTooLarge'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'
  /sessions:
    post:
      tags: [Sessões]
      operationId: createSession
      summary: Entrar com e-mail e senha
      description: |
        Define o cookie HttpOnly `user_session`. Com `remember_me: true`,
        a sessão e o cookie persistem por mais tempo; sem ele, o cookie é de sessão.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '204':
          description: Login realizado; sem corpo.
          headers:
            Set-Cookie:
              description: Cookie HttpOnly `user_session`.
              schema:
                type: string
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          description: E-mail ou senha incorretos.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '413':
          $ref: '#/components/responses/BodyTooLarge'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'
  /sessions/current:
    delete:
      tags: [Sessões]
      operationId: deleteCurrentSession
      summary: Sair da conta
      description: |
        Revoga a sessão se o cookie existir. Sem cookie, também retorna 204.
        O navegador recebe uma instrução para apagar o cookie.
      security:
        - userSession: []
        - {}
      responses:
        '204':
          description: Logout concluído; sem corpo.
        '400':
          $ref: '#/components/responses/BadRequest'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'
  /me:
    get:
      tags: [Conta]
      operationId: getCurrentAccount
      summary: Consultar a conta autenticada
      description: |
        Dados da conta e como ela entra: com senha (`has_password`), com
        Google (`has_google`) ou com os dois.
      security:
        - userSession: []
      responses:
        '200':
          description: Dados da conta.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccountResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'
    patch:
      tags: [Conta]
      operationId: updateCurrentAccount
      summary: Alterar o nome completo
      security:
        - userSession: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [full_name]
              properties:
                full_name:
                  type: string
                  minLength: 1
                  maxLength: 100
                  example: Ana Souza
      responses:
        '200':
          description: Conta atualizada.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccountResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'
    delete:
      tags: [Conta]
      operationId: deleteCurrentAccount
      summary: Excluir a conta
      description: |
        Exclui para sempre a conta, os links, as sessões de todos os aparelhos,
        a senha e o vínculo com o Google, e apaga o cookie de sessão. Conta com
        senha confirma com `password`; conta só Google confirma com o próprio
        `email`. Divide com a troca de senha o limite por conta (5 tentativas,
        depois 5 a cada 15 minutos).
      security:
        - userSession: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                password:
                  type: string
                  writeOnly: true
                email:
                  type: string
                  format: email
      responses:
        '204':
          description: Conta excluída; o cookie user_session é apagado.
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'
  /me/password:
    post:
      tags: [Conta]
      operationId: changePassword
      summary: Trocar a senha
      description: |
        Exige a senha atual. Em sucesso, troca a senha, encerra todas as
        sessões da conta (outros aparelhos saem) e devolve um cookie
        `user_session` novo para este navegador, com o mesmo prazo da sessão
        anterior. Limite por conta: 5 tentativas seguidas e depois 5 a cada
        15 minutos. Contas que só entram com Google recebem 409.
      security:
        - userSession: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [current_password, new_password, new_password_confirmation]
              properties:
                current_password:
                  type: string
                  writeOnly: true
                new_password:
                  type: string
                  writeOnly: true
                  minLength: 8
                  description: 'Senha da conta: 8+ caracteres, até 1024 bytes, com ao menos uma letra maiúscula, um número e um caractere especial (nem letra, nem número, nem espaço).'
                new_password_confirmation:
                  type: string
                  writeOnly: true
                  description: Deve ser igual a `new_password`.
      responses:
        '204':
          description: Senha trocada; sem corpo.
          headers:
            Set-Cookie:
              description: Novo cookie `user_session`.
              schema:
                type: string
        '400':
          description: Senha atual incorreta, confirmação diferente, senha nova igual à atual, curta ou longa.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          $ref: '#/components/responses/Conflict'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'
  /auth/google:
    get:
      tags: [Google]
      operationId: startGoogleAuth
      summary: Iniciar autenticação com Google
      description: |
        Redireciona o navegador para o Google e define cookies temporários
        usados na validação do callback.
      responses:
        '302':
          description: Redirecionamento para a página de autorização do Google.
          headers:
            Location:
              description: URL de autorização do Google.
              schema:
                type: string
                format: uri
            Set-Cookie:
              description: Cookies temporários de segurança do fluxo OAuth.
              schema:
                type: string
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'
  /auth/google/callback:
    get:
      tags: [Google]
      operationId: finishGoogleAuth
      summary: Finalizar autenticação com Google
      description: |
        Callback chamado pelo Google. O navegador deve trazer os cookies
        temporários definidos por `/auth/google`. `code` e `state` são enviados
        pelo Google; não são valores criados manualmente pelo cliente. Sempre
        termina com redirect para o frontend configurado em `FRONTEND_URL`:
        `/painel` no sucesso e `/entrar?erro=google` em qualquer falha. O
        destino vem só da configuração, nunca da requisição.
      security:
        - googleState: []
          googleNonce: []
          googleCodeVerifier: []
      parameters:
        - name: code
          in: query
          description: Código de autorização, presente quando o usuário autoriza.
          schema:
            type: string
        - name: state
          in: query
          description: Estado retornado pelo Google, presente no sucesso.
          schema:
            type: string
        - name: error
          in: query
          description: Erro retornado pelo Google, caso o usuário recuse ou cancele.
          schema:
            type: string
      responses:
        '303':
          description: |
            Redirect para o frontend. No sucesso, define `user_session` e aponta
            para `FRONTEND_URL/painel`; em falha (recusa, cookies ausentes,
            state diferente, erro do Google ou interno), aponta para
            `FRONTEND_URL/entrar?erro=google` sem criar sessão.
          headers:
            Location:
              description: Página do frontend.
              schema:
                type: string
                format: uri
            Set-Cookie:
              description: Remoção dos cookies temporários e, no sucesso, cookie de sessão.
              schema:
                type: string
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'
  /urls:
    post:
      tags: [Links]
      operationId: createURL
      summary: Criar link curto
      description: |
        Cria um link público ou protegido por senha para o usuário autenticado.
        URLs originais aceitam apenas HTTP ou HTTPS e não podem apontar para o
        próprio domínio curto. Links privados exigem uma senha de pelo menos
        oito caracteres; ela é armazenada como hash Argon2id.
      security:
        - userSession: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              oneOf:
                - $ref: '#/components/schemas/PublicURLRequest'
                - $ref: '#/components/schemas/PrivateURLRequest'
            examples:
              public:
                summary: Link público
                value:
                  url: https://example.com/artigo
                  visibility: public
              private:
                summary: Link privado
                value:
                  url: https://example.com/privado
                  visibility: private
                  password: senha-segura
      responses:
        '201':
          description: Link criado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateURLResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '413':
          $ref: '#/components/responses/BodyTooLarge'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'
    get:
      tags: [Links]
      operationId: listURLs
      summary: Listar meus links
      description: |
        Retorna somente links pertencentes ao usuário da sessão. A ordenação é
        por `created_at` e `id`, ambos decrescentes. Para continuar, copie
        `next_cursor` da resposta anterior para o parâmetro `cursor`; ele é
        apenas uma posição de paginação, não uma credencial.
      security:
        - userSession: []
      parameters:
        - name: limit
          in: query
          description: Quantidade máxima de links por página.
          schema:
            type: integer
            minimum: 1
            maximum: 20
            default: 20
        - name: cursor
          in: query
          description: Cursor Base64URL sem padding recebido em `next_cursor`.
          schema:
            type: string
      responses:
        '200':
          description: Página dos links do usuário.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListURLsResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'
  /urls/{code}:
    get:
      tags: [Links]
      operationId: getOwnedURL
      summary: Consultar metadados de um link meu
      description: |
        Retorna os metadados e o contador de cliques de um link pertencente ao
        usuário da sessão. Código inexistente e link de outro usuário retornam
        o mesmo 404. Este endpoint não abre nem desbloqueia o link curto.
        `click_count` tem consistência eventual: cliques publicados no
        RabbitMQ aparecem depois que o worker os processa.
      security:
        - userSession: []
      parameters:
        - name: code
          in: path
          required: true
          description: Shortcode do link.
          schema:
            type: string
            minLength: 6
            pattern: '^[0-9A-Za-z]+$'
          example: Ab3dX9
      responses:
        '200':
          description: Metadados do link pertencente ao usuário.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListedURL'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: Código inexistente ou link pertencente a outro usuário.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'
    patch:
      tags: [Links]
      operationId: updateOwnedURL
      summary: Editar um link meu
      description: |
        Troca o destino, a visibilidade ou a senha. Campos ausentes ficam como
        estão; ao menos um precisa vir. Mudar para privado exige `password`
        quando o link era público. Num link privado, `password` vazio mantém a
        senha, e uma senha nova encerra todas as sessões de desbloqueio do link.
        Mudar para público apaga a senha. O destino em cache é descartado antes
        e depois da gravação.
      security:
        - userSession: []
      parameters:
        - name: code
          in: path
          required: true
          schema:
            type: string
            minLength: 6
            pattern: '^[0-9A-Za-z]+$'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                url:
                  type: string
                  format: uri
                  description: Novo destino, HTTP ou HTTPS.
                visibility:
                  type: string
                  enum: [public, private]
                password:
                  type: string
                  writeOnly: true
                  description: Senha do link privado. Vazio mantém a atual.
      responses:
        '200':
          description: Link atualizado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListedURL'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: Código inexistente ou link pertencente a outro usuário.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'
    delete:
      tags: [Links]
      operationId: deleteOwnedURL
      summary: Apagar um link meu
      description: |
        Apaga o link e as sessões de desbloqueio dele, e descarta o destino do
        cache. Depois disso o link curto responde 404, e o código nunca é
        reaproveitado.
      security:
        - userSession: []
      parameters:
        - name: code
          in: path
          required: true
          schema:
            type: string
            minLength: 6
            pattern: '^[0-9A-Za-z]+$'
      responses:
        '204':
          description: Link apagado.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: Código inexistente ou link pertencente a outro usuário.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'
  /{code}:
    get:
      tags: [Links]
      operationId: openShortURL
      summary: Abrir um link curto público ou privado
      description: |
        Não exige sessão de conta. Links públicos redirecionam diretamente.
        Links privados sem cookie de acesso válido mostram uma página HTML de
        senha; o cookie é específico do link e dura 30 minutos por padrão.
        Somente um redirect efetivo registra um clique: a API publica um evento
        no RabbitMQ, espera a confirmação do broker e o worker incrementa
        `click_count` depois. Se a publicação falhar, a API incrementa o
        contador no PostgreSQL antes de responder; se isso também falhar,
        retorna 503. A resposta de redirect não deve ser armazenada pelo
        navegador; acessos posteriores precisam voltar à API.
      security:
        - {}
        - linkAccessSession: []
      parameters:
        - name: code
          in: path
          required: true
          description: Shortcode do link público ou privado.
          schema:
            type: string
            minLength: 6
            pattern: '^[0-9A-Za-z]+$'
          example: Ab3dX9
      responses:
        '200':
          description: Link privado sem sessão válida; formulário HTML de senha, sem contar clique.
          content:
            text/html:
              schema:
                type: string
        '302':
          description: Link público ou link privado desbloqueado; clique registrado.
          headers:
            Location:
              description: URL original de destino.
              schema:
                type: string
                format: uri
            Cache-Control:
              description: Impede o armazenamento do redirect.
              schema:
                type: string
                example: no-store
        '404':
          description: Código inexistente.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          description: O clique não pôde ser registrado no RabbitMQ nem no PostgreSQL; nenhum redirect.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
  /{code}/access:
    post:
      tags: [Links]
      operationId: unlockPrivateURL
      summary: Informar a senha de um link privado
      description: |
        Confere a senha usando Argon2id e cria uma sessão específica para este
        link. O cookie HttpOnly tem `Path=/{code}` e TTL padrão de 30 minutos,
        configurável por `LINK_ACCESS_SESSION_TTL`. A resposta 303 faz o
        navegador repetir GET /{code} com o cookie. Esta operação não conta
        clique; a contagem acontece somente no GET que redireciona.
      security: []
      parameters:
        - name: code
          in: path
          required: true
          description: Shortcode do link privado.
          schema:
            type: string
            minLength: 6
            pattern: '^[0-9A-Za-z]+$'
          example: Ab3dX9
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              required: [password]
              properties:
                password:
                  type: string
                  format: password
                  writeOnly: true
                  description: Senha compartilhada pelo criador do link.
      responses:
        '303':
          description: Senha correta; sessão criada e navegador redirecionado para o shortcode.
          headers:
            Location:
              description: Caminho do link curto, para repetir o GET com o cookie.
              schema:
                type: string
                example: /Ab3dX9
            Set-Cookie:
              description: Cookie `link_access_session` específico do link, com HttpOnly, SameSite=Lax e Path=/{code}; Secure quando configurado.
              schema:
                type: string
        '400':
          description: Formulário ausente ou inválido; página HTML com mensagem de erro.
          content:
            text/html:
              schema:
                type: string
        '401':
          description: Senha incorreta; página HTML para tentar novamente, sem criar sessão.
          content:
            text/html:
              schema:
                type: string
        '404':
          description: Código inexistente ou link não privado.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'
components:
  securitySchemes:
    userSession:
      type: apiKey
      in: cookie
      name: user_session
      description: Cookie HttpOnly emitido após login com senha ou Google.
    linkAccessSession:
      type: apiKey
      in: cookie
      name: link_access_session
      description: Cookie HttpOnly opcional, específico de um link privado; não autentica a conta.
    passwordRegistration:
      type: apiKey
      in: cookie
      name: password_registration
      description: Cookie HttpOnly da tentativa temporária de cadastro.
    passwordReset:
      type: apiKey
      in: cookie
      name: password_reset
      description: Cookie HttpOnly da tentativa temporária de recuperação.
    googleState:
      type: apiKey
      in: cookie
      name: google_auth_state
    googleNonce:
      type: apiKey
      in: cookie
      name: google_auth_nonce
    googleCodeVerifier:
      type: apiKey
      in: cookie
      name: google_auth_code_verifier
  schemas:
    Problem:
      type: object
      description: |
        Erro no formato da RFC 9457 (Problem Details), enviado como
        `application/problem+json`. `detail` é a mensagem em português para
        mostrar às pessoas; `code` é um nome estável para o cliente decidir o
        que fazer sem depender do texto. Os códigos estão em `docs/api.md`.
        Uma navegação do navegador (`Accept` com `text/html`) recebe, no
        lugar, uma página HTML com a mensagem para pessoas.
      required: [type, title, status, detail, code]
      properties:
        type:
          type: string
          description: Sempre `about:blank`; o significado vem do status HTTP.
          example: about:blank
        title:
          type: string
          description: Frase padrão do status HTTP.
          example: Bad Request
        status:
          type: integer
          example: 400
        detail:
          type: string
          example: senha muito curta
        code:
          type: string
          pattern: '^[a-z_]+$'
          example: password_too_short
    EmailRequest:
      type: object
      additionalProperties: false
      required: [email]
      properties:
        email:
          type: string
          format: email
          example: pessoa@example.com
    RegistrationRequest:
      type: object
      additionalProperties: false
      required: [email, password, full_name]
      properties:
        email:
          type: string
          format: email
          example: pessoa@example.com
        password:
          type: string
          writeOnly: true
          minLength: 8
          description: 'Senha da conta: 8+ caracteres, até 1024 bytes, com ao menos uma letra maiúscula, um número e um caractere especial (nem letra, nem número, nem espaço).'
          example: Senha-forte1
        full_name:
          type: string
          minLength: 1
          maxLength: 100
          description: Espaços nas pontas são removidos e espaços repetidos viram um só. Caracteres de controle são rejeitados.
          example: Ana Souza
    CodeRequest:
      type: object
      additionalProperties: false
      required: [code]
      properties:
        code:
          type: string
          description: Código recebido por e-mail.
          example: '123456'
    PasswordResetConfirmRequest:
      type: object
      additionalProperties: false
      required: [code, password, password_confirmation]
      properties:
        code:
          type: string
          description: Código recebido por e-mail.
          example: '12345678'
        password:
          type: string
          writeOnly: true
          minLength: 8
          description: 'Senha da conta: 8+ caracteres, até 1024 bytes, com ao menos uma letra maiúscula, um número e um caractere especial (nem letra, nem número, nem espaço).'
        password_confirmation:
          type: string
          writeOnly: true
          description: Deve ser igual a `password`.
    LoginRequest:
      type: object
      additionalProperties: false
      required: [email, password]
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          writeOnly: true
        remember_me:
          type: boolean
          default: false
          description: Quando verdadeiro, mantém a sessão persistente.
    UserResponse:
      type: object
      additionalProperties: false
      required: [id, email]
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
          format: email
    AccountResponse:
      type: object
      additionalProperties: false
      required: [id, email, full_name, has_password, has_google, created_at]
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
          format: email
        full_name:
          type: [string, 'null']
          description: Nulo em contas antigas que ainda não têm nome.
        has_password:
          type: boolean
          description: A conta entra com email e senha e pode trocar a senha.
        has_google:
          type: boolean
          description: A conta tem login com Google vinculado.
        created_at:
          type: string
          format: date-time
    PublicURLRequest:
      type: object
      additionalProperties: false
      required: [url, visibility]
      properties:
        url:
          type: string
          format: uri
          description: URL absoluta HTTP ou HTTPS.
        visibility:
          type: string
          const: public
    PrivateURLRequest:
      type: object
      additionalProperties: false
      required: [url, visibility, password]
      properties:
        url:
          type: string
          format: uri
          description: URL absoluta HTTP ou HTTPS.
        visibility:
          type: string
          const: private
        password:
          type: string
          minLength: 8
          writeOnly: true
          description: Senha do link; nunca retornada pela API.
    CreateURLResponse:
      type: object
      additionalProperties: false
      required: [short_code, short_url]
      properties:
        short_code:
          type: string
          minLength: 6
          pattern: '^[0-9A-Za-z]+$'
          example: Ab3dX9
        short_url:
          type: string
          format: uri
          example: https://shortbit.com.br/Ab3dX9
    ListedURL:
      type: object
      additionalProperties: false
      required: [short_code, original_url, visibility, click_count, created_at, updated_at]
      properties:
        short_code:
          type: string
          minLength: 6
          pattern: '^[0-9A-Za-z]+$'
        original_url:
          type: string
          format: uri
        visibility:
          type: string
          enum: [public, private]
        click_count:
          type: integer
          format: int64
          minimum: 0
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    ListURLsResponse:
      type: object
      additionalProperties: false
      required: [urls, next_cursor]
      properties:
        urls:
          type: array
          items:
            $ref: '#/components/schemas/ListedURL'
        next_cursor:
          type: [string, 'null']
          description: 'null quando não há mais links.'
  responses:
    BadRequest:
      description: Corpo JSON, URL, limite ou cursor inválido.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Unauthorized:
      description: Sessão ausente, inválida ou expirada.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Conflict:
      description: O e-mail já está em uso ou o cadastro não pode ser concluído por conflito.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Gone:
      description: Tentativa temporária ausente ou expirada.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    BodyTooLarge:
      description: Corpo da requisição acima do limite global de 250 KiB (`body_too_large`).
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    TooManyRequests:
      description: Limite global por IP ou limite específico de uma operação excedido.
      headers:
        Retry-After:
          description: Segundos até uma nova tentativa.
          schema:
            type: integer
            minimum: 1
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    InternalError:
      description: Falha interna do servidor.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
