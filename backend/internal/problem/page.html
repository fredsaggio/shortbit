<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#031f39">
  <meta name="referrer" content="no-referrer">
  <meta name="robots" content="noindex">
  <title>{{.Title}} · shortbit</title>
  <style>
    :root {
      color-scheme: light;
      font-family: "Plus Jakarta Sans", ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
      --navy: #031f39;
      --brand: #f36600;
      --surface: #f6f4ef;
      --card: #fffffd;
      --muted: #62615f;
      --line: #d7d5d0;
    }
    * { box-sizing: border-box; }
    body { min-height: 100vh; margin: 0; display: flex; flex-direction: column; background: var(--surface); color: var(--navy); }
    header { background: var(--navy); }
    .bar { max-width: 1120px; margin: 0 auto; padding: 18px 24px; }
    .logo { color: #fff; font-family: Sora, ui-sans-serif, system-ui, sans-serif; font-size: 25px; font-weight: 700; letter-spacing: -0.04em; text-decoration: none; }
    .logo span { color: var(--brand); }
    main { flex: 1; display: grid; place-items: center; padding: 48px 16px; }
    .card { width: min(100%, 480px); padding: 40px 36px; border: 1px solid var(--line); border-radius: 24px; background: var(--card); box-shadow: 0 18px 50px rgba(3, 31, 57, 0.08); text-align: center; }
    h1 { margin: 0 0 12px; font-size: 28px; line-height: 1.2; letter-spacing: -0.03em; }
    p.text { margin: 0 0 28px; color: var(--muted); font-size: 16px; line-height: 1.6; }
    a.action { display: inline-block; padding: 13px 22px; border-radius: 10px; background: var(--navy); color: #fff; font-weight: 700; text-decoration: none; }
    a.action:hover { background: #0a3159; }
    a:focus-visible { outline: 3px solid var(--brand); outline-offset: 3px; }
    @media (max-width: 480px) { .card { padding: 32px 22px; } h1 { font-size: 24px; } }
  </style>
</head>
<body>
  <header><div class="bar"><a class="logo" href="/">short<span>bit</span></a></div></header>
  <main>
    <section class="card" aria-labelledby="title">
      <h1 id="title">{{.Title}}</h1>
      <p class="text">{{.Text}}</p>
      <a class="action" href="{{.ActionHref}}">{{.ActionLabel}}</a>
    </section>
  </main>
</body>
</html>
