services:
  postgres-shortener:
    image: postgres:18
    container_name: postgres-shortener
    
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5433:5432"
    volumes:
      - postgres-shortener:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 5s
    restart: unless-stopped

  redis-shortener:
    image: redis:8-alpine
    container_name: redis_shortener
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  rabbitmq-shortener:
    image: rabbitmq:4-management
    container_name: rabbitmq-shortener
    hostname: rabbitmq-shortener
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-shortbit}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:?Defina RABBITMQ_PASSWORD para iniciar o RabbitMQ}
    ports:
      - "127.0.0.1:5672:5672"
      - "127.0.0.1:15672:15672"
    volumes:
      - rabbitmq-shortener:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "check_running"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart: unless-stopped

  # Grafana with Prometheus, Loki and an OpenTelemetry collector in one
  # container, for development only: the API and worker send metrics and logs
  # to it on 4318, and Grafana opens on http://localhost:3000 (admin/admin).
  # Production sends to Grafana Cloud instead (backend/docs/observability.md).
  grafana-shortener:
    image: grafana/otel-lgtm:0.39.0
    container_name: grafana-shortener
    ports:
      - "127.0.0.1:3000:3000"
      - "127.0.0.1:4318:4318"
    environment:
      # Read-only access without login; the port listens on localhost only.
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
    volumes:
      - grafana-shortener:/data
      - ./observability/shortbit-dashboard.json:/otel-lgtm/shortbit/shortbit-dashboard.json:ro
      - ./observability/grafana-dashboards.yaml:/otel-lgtm/grafana/conf/provisioning/dashboards/shortbit.yaml:ro
    restart: unless-stopped

  # The app, built from the root Dockerfile (the production image). It uses
  # the host network so the localhost addresses in .env (Postgres on 5433,
  # Redis, RabbitMQ) work unchanged; only the variables listed here reach the
  # container. The API serves the web app on http://localhost:8080.
  api-shortener:
    build: .
    image: shortbit:local
    container_name: api-shortener
    network_mode: host
    environment:
      DATABASE_URL: ${DATABASE_URL:?Defina DATABASE_URL no .env}
      RABBITMQ_URL: ${RABBITMQ_URL:?Defina RABBITMQ_URL no .env}
      # Always the Redis of this file, even when .env points REDIS_URL at a
      # hosted one.
      REDIS_URL: ""
      REDIS_ADDR: localhost:6379
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:?Defina GOOGLE_CLIENT_ID no .env}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:?Defina GOOGLE_CLIENT_SECRET no .env}
      GOOGLE_REDIRECT_URL: ${GOOGLE_REDIRECT_URL:?Defina GOOGLE_REDIRECT_URL no .env}
      EMAIL_FROM: ${EMAIL_FROM:?Defina EMAIL_FROM no .env}
      RESEND_API_KEY: ${RESEND_API_KEY:?Defina RESEND_API_KEY no .env}
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-}
      # The front comes from the API itself here, not from Vite on 5173.
      FRONTEND_URL: http://localhost:8080
      RUN_MIGRATIONS: "true"
      # Clicks go to the worker service below (ADR 0002).
      RUN_CLICK_WORKER: "false"
      # Metrics and logs go to the local Grafana above.
      OTEL_EXPORTER_OTLP_ENDPOINT: http://localhost:4318
      OTEL_RESOURCE_ATTRIBUTES: deployment.environment.name=local
    depends_on:
      postgres-shortener:
        condition: service_healthy
      redis-shortener:
        condition: service_healthy
      rabbitmq-shortener:
        condition: service_healthy
      grafana-shortener:
        condition: service_started
    restart: unless-stopped

  worker-shortener:
    image: shortbit:local
    container_name: worker-shortener
    network_mode: host
    entrypoint: ["/app/worker"]
    environment:
      DATABASE_URL: ${DATABASE_URL:?Defina DATABASE_URL no .env}
      RABBITMQ_URL: ${RABBITMQ_URL:?Defina RABBITMQ_URL no .env}
      OTEL_EXPORTER_OTLP_ENDPOINT: http://localhost:4318
      OTEL_RESOURCE_ATTRIBUTES: deployment.environment.name=local
    depends_on:
      # The API applies the migrations the worker relies on.
      api-shortener:
        condition: service_started
      rabbitmq-shortener:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres-shortener:
  rabbitmq-shortener:
  grafana-shortener:
