services:
  postgres-shortener:
    image: postgres:18
    container_name: postgres-shortener
    
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5433:5432"
    volumes:
      - postgres-shortener:/var/lib/postgresql/data

volumes:
  postgres-shortener: